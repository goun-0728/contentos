<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <title>리뷰 수집기</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{width:300px;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;font-size:14px;color:#172033;background:#fff}
    .header{background:#102a46;color:#fff;padding:14px 16px}
    .header h1{font-size:15px;font-weight:700}
    .header p{font-size:11px;opacity:.7;margin-top:3px}
    .body{padding:14px 16px}
    label{display:grid;gap:5px;font-weight:700;color:#26384f;margin-bottom:10px}
    input[type=text]{width:100%;border:1px solid #cfd7e3;border-radius:6px;padding:8px 10px;font:inherit;background:#f8fafc;color:#172033}
    input[type=text]:focus{outline:none;border-color:#183a5a;background:#fff}
    .checkbox-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;cursor:pointer}
    .checkbox-row input{width:16px;height:16px;cursor:pointer}
    .checkbox-row span{font-size:13px;color:#26384f}
    button#collect{width:100%;padding:11px 0;background:#102a46;color:#fff;border:0;border-radius:7px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
    button#collect:disabled{opacity:.55;cursor:wait}
    #status{margin-top:12px;padding:10px;border-radius:6px;font-size:13px;line-height:1.5;display:none}
    #status.ok{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
    #status.err{background:#fff1f2;color:#be123c;border:1px solid #fecdd3}
    #status.info{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}
    .divider{border:none;border-top:1px solid #eef2f6;margin:12px 0}
    .open-app{display:block;text-align:center;font-size:12px;color:#315475;text-decoration:none;padding:4px 0}
    .open-app:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div class="header">
    <h1>리뷰 클레임 수집기</h1>
    <p>네이버 스마트스토어 현재 페이지 리뷰 수집</p>
  </div>
  <div class="body">
    <label>품목명 <input type="text" id="itemName" placeholder="예: 김치"/></label>
    <label>업체명 <input type="text" id="vendorName" placeholder="예: 경쟁사A"/></label>
    <label class="checkbox-row">
      <input type="checkbox" id="claimOnly"/>
      <span>클레임 후보만 수집 (부정어 포함 리뷰)</span>
    </label>
    <button id="collect">현재 페이지 리뷰 수집</button>
    <div id="status"></div>
    <hr class="divider"/>
    <a class="open-app" href="http://localhost:4174" target="_blank" rel="noopener">→ 수집기 웹앱 열기 (localhost:4174)</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
